experience:
  - period: 01/2023 — Present
    place: Berlin, Germany
    company: Freie Universität Berlin
    role: Research Assistant
    bullets:
      - Developed Ariel-ML, a Rust-based TinyML framework featuring multi-core scheduling on microcontrollers.
      - Developed msf-CNN, a CNN fusion technique that achieves inference using 50% less RAM on MCUs.
      - Designed TinyChirp, an acoustic TinyML pipeline that extended sensor lifetime from 2 to 18 weeks.
      - Extended U-TOE with secure CI/CD for ML models on low-power devices through RIOT-ML.
      - Developed U-TOE, a TinyML benchmarking toolkit with RIOT OS support.
  - period: 11/2021 — 12/2022
    place: Berlin, Germany
    company: MedRhein GmbH
    role: Product Manager & SAP Consultant · part-time
    bullets:
